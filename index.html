    map.querySelectorAll('[data-layer]').forEach(box=>box.onchange=()=>{
      const layer=box.dataset.layer;
      view.querySelectorAll(`.feat-${layer},[data-atlas-name-layer="${layer}"]`).forEach(el=>el.toggleAttribute('hidden',!box.checked));
    });
    const interaction = (query, fn, key) => {
      if (!fn) return;
      view.querySelectorAll(query).forEach(el=>{
        el.onclick=()=>fn(el.dataset[key]);
        el.onkeydown=e=>{ if (e.key==='Enter'||e.key===' ') {e.preventDefault();el.dispatchEvent(new MouseEvent('click',{bubbles:true}));} };
      });
    };
    interaction('[data-map-model]',onModel,'mapModel');
    interaction('[data-island]',onIsland,'island');
    interaction('[data-map-choice]',()=>{},'mapChoice');
    if (onPaint) {
      for (const [type,selector,key] of [['mount','[data-range-index]','rangeIndex'],['water','[data-river-index]','riverIndex']]) {
        view.querySelectorAll(selector).forEach(el=>{
          el.classList.add('atlas-paintable');
          el.onclick=()=>onPaint(type,Number(el.dataset[key]));
        });
      }
    }
    function refresh() {
      if (!map.isConnected) return;
      try {
        if (elevation && !actualRaster) actualRaster = raster(elevation);
        if (!elevation && !offlineRaster) offlineRaster = raster(geo.approximateHeight);
        const href = elevation ? actualRaster : offlineRaster;
        map.querySelector('[data-atlas-raster]').setAttribute('href',href);
      } catch { /* Land fill works without canvas. */ }
      if (coastline) {
        const shore = shapes(outline,xy);
        for (const name of ['clip','fill','shore']) map.querySelector('[data-atlas-'+name+']').innerHTML=shore;
      }
      if (status) status.textContent = sourceText();
      if (elevation && realButton) {
        map.querySelector('[data-elevation-legend]').textContent='고도(m)';
        const readings=['100 미만','100~300','300~700','700~1,400','1,400 이상'];
        map.querySelectorAll('[data-band]').forEach(el=>el.textContent=readings[Number(el.dataset.band)]);
      }
    }
    function load() {
      if (realButton) realButton.disabled=true;
      if (status) status.textContent='공개 지도 자료를 불러오는 중이에요. 지금 보이는 지도도 사용할 수 있어요.';
      dataRequest ??= Promise.allSettled([
        elevation || geo.loadHeight(geo.bounds,7).then(result=>{elevation=result;}),
        coastline || geo.loadCoast().then(result=>{coastline=result;})
      ]).then(results=>{ if (results.some(r=>r.status==='rejected')) dataRequest=null; });
      dataRequest.then(()=>{
        refresh();
        if (realButton) {
          realButton.disabled=Boolean(elevation&&coastline);
          realButton.textContent=elevation&&coastline ? '실제 지도 자료 적용' : '실제 지도 자료 다시 시도';
        }
        if (status && !(elevation&&coastline)) status.textContent += ' 연결되지 않은 자료는 학습용 표현을 유지해요.';
      });
    }
    refresh();
    if (realButton) realButton.onclick=load;
    if (automatic) load();
    return view;
  }
  return { render, bind, projection };
})();
</script>
<script>
/* Offline relief models. Coordinates are in model units, north is −z. */
window.createLearningRelief = function (T, World, textSprite) {
  const clamp = T.MathUtils.clamp;
  const smooth = (x, a, b) => T.MathUtils.smoothstep(x, a, b);
  const bell = x => Math.exp(-x * x);
  const texture = (x, z) => Math.sin(x * .8 + z * .39) * Math.cos(z * .61 - x * .21);
  const ridge = (x, z, position, width, height) =>
    bell((x - position) / width) * height * smooth(z, -24, -18) * (1 - smooth(z, 16, 24));

  const ridgeEast = z => 7 + 2.2 * Math.sin(z * .17);
  const ridgeWest = z => -11 + 2 * Math.sin(z * .15 + 1.1);
  const mountain = (x, z) => .65
    + ridge(x, z, ridgeEast(z), 5.4, 4.8 + 7 * bell((z + 10) / 4.5) + 5.3 * bell((z - 8) / 5))
    + ridge(x, z, ridgeWest(z), 5.7, 3.9 + 5.8 * bell((z + 4) / 5) + 4 * bell((z - 12) / 4.7))
    + .29 * texture(x, z);

  const center = z => 3.9 * Math.sin((z + 4) * .18) + 1.7 * Math.sin(z * .31);
  const waterLevel = z => 3.0 - (z + 24) * .048;
  const channel = z => 1.05 + 1.65 * smooth(z, -11, 20);
  function river(x, z) {
    const distance = Math.abs(x - center(z));
    const width = channel(z);
    const up = 1 - smooth(z, -12, 14);
    const bank = smooth(distance, width * .55, width * 1.37);
    const valleyWall = smooth(distance, width * 1.4 + (1 - up) * 5, 13 + (1 - up) * 5);
    return waterLevel(z) - .84 + bank * (1.48 + texture(x, z) * .14)
      + valleyWall * (up * (8.2 + 1.5 * texture(x * .48, z)) + (1 - up) * .72);
  }

  const islands = {
    east: [],
    west: [[-16, 12, 3.2, 2.1], [7, 14, 3.1, 2.9], [16, 16, 2.7, 1.7]],
    south: [[-18, 12, 4, 2.6], [-10, 19, 3.2, 2.4], [-3, 11, 3.1, 2.4], [4, 18, 4.4, 3.6], [12, 12, 3.8, 3], [20, 17, 2.7, 2.2], [-18, 21, 2.5, 1.5]]
  };
  function island(u, v, a, b, width, depth, height, slope = 4) {
    const r = Math.hypot((u - a) / width, (v - b) / depth);
    const shore = smooth(1 - r + .09 * texture(u, v), 0, 1 / slope);
    return -1.65 + shore * (2.1 + height * (1 - Math.min(r, 1)));
  }
  function coast(type, x, z) {
    const [u, v] = type === 'east' ? [z, x] : type === 'west' ? [z, -x] : [x, z];
    const shore = type === 'east' ? 2 + 1.05 * Math.sin(u * .24)
      : 2 + 4.6 * Math.sin(u * .26) + 2.3 * Math.sin(u * .55 + 1.4);
    const inland = shore - v;
    const cliff = type === 'east' ? smooth(u, -16, -8) * (1 - smooth(u, 1, 7))
      : type === 'south' ? .75 * smooth(u, 4, 10) : 0;
    const slope = -1.65 + 6.1 * smooth(inland, -3, 11) + 1.5 * smooth(inland, 9, 22);
    const steeper = -1.65 + 8.1 * smooth(inland, -.7, 1.1) + 1.15 * smooth(inland, 4, 14);
    const mainland = T.MathUtils.lerp(slope, steeper, cliff)
      + .27 * texture(u, v) * smooth(inland, 0, 6);
    return Math.max(mainland, ...islands[type].map(shape => island(u, v, ...shape, type === 'south' ? 4.6 : 2.4)));
  }
  function dokdo(x, z) {
    return Math.max(
      island(x, z, -9, -2, 8.8, 7, 11.6, 5.1),
      island(x, z, 8, 2.8, 7.8, 6.6, 6.4, 5),
      island(x, z, -1.9, -8, 1.65, 1.8, 2.1),
      island(x, z, 14.6, 9.2, 1.45, 1.05, 1.6));
  }
  const models = {
    mountain: { height: mountain, yaw: -.33, side: 0, labels: [
      ['높은 봉우리', ridgeEast(-10), -10], ['낮은 봉우리', ridgeWest(12), 12],
      ['능선', ridgeEast(0), 0], ['골짜기', -1, 1]
    ] },
    river: { height: river, yaw: -.68, side: -1.1, labels: [
      ['좁은 골짜기', center(-15), -15], ['넓은 하천 주변', center(15) + 5, 15]
    ] },
    east: { height: (x, z) => coast('east', x, z), yaw: 1.08, side: 1.57, labels: [
      ['급한 구간', 2.4, -7], ['완만한 구간', 1, 13]
    ] },
    west: { height: (x, z) => coast('west', x, z), yaw: -1.08, side: -1.57, labels: [
      ['완만한 해안', -3, 7], ['섬', -14, 7]
    ] },
    south: { height: (x, z) => coast('south', x, z), yaw: -.32, side: 0, labels: [
      ['육지', 4, -10], ['섬', 4, 18]
    ] },
    dokdo: { height: dokdo, yaw: -.32, side: 0, labels: [
      ['서도', -9, -2], ['동도', 8, 2.8], ['바위섬', 14.6, 9.2]
    ] }
  };
  const colors = Object.fromEntries(Object.entries({
    low: 0xb5ca85, forest: 0x63824d, rock: 0xaba68d, peak: 0xd3c7ac,
    sand: 0xe7cb97, bed: 0x629fa3, earth: 0xa78a67, deep: 0x776553, grass: 0x9fb878
  }).map(([key, value]) => [key, new T.Color(value)]));
  const perimeter = [i => [-24 + 48 * i, -24], i => [24, -24 + 48 * i],
    i => [24 - 48 * i, 24], i => [-24, 24 - 48 * i]];

  function surfaceColor(kind, x, y, z, slope, out) {
    if (kind === 'mountain') {
      out.copy(colors.low).lerp(colors.forest, smooth(y, .5, 5))
        .lerp(colors.rock, smooth(y, 5.6, 9) * .82 + smooth(slope, .4, 1.05) * .18)
        .lerp(colors.peak, smooth(y, 8, 12));
    } else if (kind === 'river') {
      out.copy(colors.sand).lerp(colors.grass, smooth(Math.abs(x - center(z)), channel(z), channel(z) + 2))
        .lerp(colors.forest, smooth(y - waterLevel(z), 1.9, 6.3));
    } else {
      out.copy(colors.bed).lerp(colors.sand, smooth(y, -.45, .3))
        .lerp(colors.grass, smooth(y, .35, 3.4))
        .lerp(colors.rock, smooth(y, .45, 2) * (kind === 'dokdo' ? .96 : smooth(slope, .44, 1.7) * .95));
    }
    out.multiplyScalar(1 + .075 * texture(x, z));
  }

  function buildGround(root, kind, height) {
    const n = 180;
    const geometry = new T.PlaneGeometry(48, 48, n, n);
    geometry.rotateX(-Math.PI / 2);
    const vertices = geometry.attributes.position;
    const color = new T.Color();
    const rgb = [];
    for (let i = 0; i < vertices.count; i++) {
      const x = vertices.getX(i), z = vertices.getZ(i), y = height(x, z);
      const slope = Math.hypot(height(x + .18, z) - y, height(x, z + .18) - y) / .18;
      vertices.setY(i, y);
      surfaceColor(kind, x, y, z, slope, color);
      rgb.push(color.r, color.g, color.b);
    }
    geometry.computeVertexNormals();
    geometry.setAttribute('color', new T.Float32BufferAttribute(rgb, 3));
    root.add(new T.Mesh(geometry, new T.MeshStandardMaterial({ vertexColors: true, roughness: .96 })));

    // The sides use the same samples as the surface so the cut face follows the relief exactly.
    const edgePositions = [], edgeColors = [], edgeFaces = [];
    for (const edge of perimeter) {
      const start = edgePositions.length / 3;
      for (let i = 0; i <= n; i++) {
        const [x, z] = edge(i / n);
        const y = height(x, z);
        for (const [level, tint] of [[y, colors.earth], [(y - 3.5) / 2, colors.earth], [-3.5, colors.deep]]) {
          edgePositions.push(x, level, z);
          const factor = 1 + .095 * Math.sin(x * 1.7 + z * 1.7 + level * 2);
          edgeColors.push(tint.r * factor, tint.g * factor, tint.b * factor);
        }
        if (i < n) {
          const a = start + i * 3;
          edgeFaces.push(a, a + 1, a + 3, a + 1, a + 4, a + 3,
            a + 1, a + 2, a + 4, a + 2, a + 5, a + 4);
        }
      }
    }
    const section = new T.BufferGeometry();
    section.setAttribute('position', new T.Float32BufferAttribute(edgePositions, 3));
    section.setAttribute('color', new T.Float32BufferAttribute(edgeColors, 3));
    section.setIndex(edgeFaces);
    section.computeVertexNormals();
    root.add(new T.Mesh(section, new T.MeshStandardMaterial({ vertexColors: true, side: T.DoubleSide })));
  }

  function buildWater(root, kind, height, actual = false) {
    const material = new T.MeshStandardMaterial({ color: 0x3b9eae, side: T.DoubleSide, roughness: .41 });
    if (kind !== 'river') {
      const sea = new T.Mesh(new T.PlaneGeometry(48, 48), material);
      sea.rotation.x = -Math.PI / 2;
      if (actual) sea.position.y = .015;
      root.add(sea);
      const position = [], faces = [];
      for (const edge of perimeter) {
        const start = position.length / 3;
        for (let i = 0; i <= 180; i++) {
          const [x, z] = edge(i / 180);
          position.push(x, 0, z, x, Math.min(0, height(x, z)), z);
          if (i < 180) {
            const a = start + i * 2;
            faces.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
          }
        }
      }
      const edge = new T.BufferGeometry();
      edge.setAttribute('position', new T.Float32BufferAttribute(position, 3));
      edge.setIndex(faces);
      edge.computeVertexNormals();
      root.add(new T.Mesh(edge, new T.MeshStandardMaterial({ color: 0x398593, side: T.DoubleSide })));
      return;
    }
    const positions = [], faces = [];
    for (let i = 0; i <= 220; i++) {
      const z = -24 + 48 * i / 220, x = center(z);
      const w = channel(z) * 1.33;
      positions.push(Math.max(-24, x - w), waterLevel(z), z, Math.min(24, x + w), waterLevel(z), z);
      if (i < 220) {
        const a = i * 2;
        faces.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
      }
    }
    const geo = new T.BufferGeometry();
    geo.setAttribute('position', new T.Float32BufferAttribute(positions, 3));
    geo.setIndex(faces);
    geo.computeVertexNormals();
    root.add(new T.Mesh(geo, material));
  }

  function addLabels(root, spec) {
    const labels = new T.Group();
    for (const [name, x, z] of spec.labels) {
      const y = Math.max(spec.height(x, z), 0);
      const label = textSprite(name);
      label.position.set(x, y + 2.1, z);
      label.scale.set(6.5, 2, 1);
      const line = new T.Line(new T.BufferGeometry().setFromPoints([
        new T.Vector3(x, y + .08, z), new T.Vector3(x, y + 2.1, z)
      ]), new T.LineBasicMaterial({ color: 0x365644 }));
      const pin = new T.Mesh(new T.SphereGeometry(.28, 12, 8), new T.MeshBasicMaterial({ color: 0xf9ddb3 }));
      pin.position.set(x, y + .16, z);
      labels.add(label, line, pin);
    }
    root.add(labels);
    return labels;
  }

  const baseReset = World.prototype.reset;
  World.prototype.reset = function () {
    if (this.mode === 'lesson') this.lessonView('angle');
    else baseReset.call(this);
  };
  World.prototype.lessonView = function (view) {
    const spec = models[this.lessonKind];
    this.yaw = view === 'top' ? 0 : view === 'side' ? spec.side : spec.yaw;
    this.pitch = view === 'top' ? Math.PI / 2 - .001 : view === 'side' ? .16 : .69;
    this.distance = this.lessonDistance();
    this.updateCamera(true);
  };
  World.prototype.lessonDistance = function () {
    return Math.max(85, 78 / Math.max(.75, this.camera.aspect));
  };
  World.prototype.learningRelief = function (kind, view = 'angle', sample = null) {
    this.clear();
    this.mode = 'lesson';
    this.placing = false;
    this.lessonKind = kind;
    let spec = models[kind];
    if (sample) {
      const region = window.TerrainGeo.regions[kind];
      const [w,s,e,n] = region.bounds;
      const mult = 48 * region.exaggeration / (region.km * 1000);
      const offset = kind === 'river' ? 22 : 0;
      const height = (x,z) => clamp((sample(w+(x/48+.5)*(e-w),n-(z/48+.5)*(n-s))-offset)*mult,-2.7,18);
      const names = {
        mountain: [['대청봉',128.465,38.119]],
        river: [['두물머리',127.312,37.532],['팔당댐',127.279,37.526]],
        east: [['정동진',129.035,37.689]],
        west: [['신두리 해안',126.186,36.836]],
        south: [['금오도',127.773,34.530]]
      };
      const labels = names[kind].map(([name,lon,lat])=>[name,48*((lon-w)/(e-w)-.5),48*((n-lat)/(n-s)-.5)]);
      spec = { ...spec,height,labels };
    }
    buildGround(this.root, sample && kind === 'river' ? 'mountain' : kind, spec.height);
    if (kind !== 'mountain' && !(sample && kind === 'river')) buildWater(this.root, kind, spec.height, Boolean(sample));
    this.lessonLabels = addLabels(this.root, spec);
    this.flowArrows = new T.Group();
    if (kind === 'river' && !sample) {
      for (const z of [-20, -13, -6, 1, 8, 15, 21]) {
        const direction = new T.Vector3(center(z + 1.5) - center(z - 1.5), -.144, 3).normalize();
        const origin = new T.Vector3(center(z), waterLevel(z) + .4, z);
        this.flowArrows.add(new T.ArrowHelper(direction, origin, 2.4, 0xffe8a3, 1.12, .9));
      }
      this.root.add(this.flowArrows);
    }
    this.lessonView(view);
  };
};

    function mark(type,index) {

        message(tool==='mount' ? '동쪽에서 남북으로 길게 이어지는 줄기를 살펴봐요.' :
          tool==='water' ? '검룡소와 한강 하구를 연결하는 파란 물길을 살펴봐요.' : '화살표는 물길 위의 두 지점을 차례로 찍어요.');

 ['동쪽과 서쪽의 높이 비교','중부 지방을 동서 방향으로 잘라 보면 동쪽이 높고 서쪽이 낮은 모습을 볼 수 있어요. 산봉우리 하나만 보고 판단하지 말고 전체적인 분포를 비교해요.'],
 ['높은 곳에서 낮은 곳으로','우리나라의 큰 하천은 대부분 서쪽이나 남쪽으로 흘러요. 북쪽과 동쪽의 높은 산지에서 남쪽과 서쪽의 낮은 곳으로 흐르는 지형과 관련이 있어요. 모든 하천이 같은 방향으로 흐르는 것은 아니에요.'],
 ['하천 주변의 평야','하천 주변에는 낮고 평평한 땅인 평야가 발달해요. 하천이 운반한 흙과 모래가 쌓여 만들어진 넓은 평야는 논농사에 이용돼요. 김제평야를 떠올려 보세요.'],
 ['지형과 관광지','설악산과 대관령 목장은 산지 지형을, 북한강과 남한강이 만나는 두물머리와 김제평야, 호박소 계곡은 하천과 관련된 지형을 살펴보기 좋아요.'],
 ['영월 선암마을','하천이 깊게 굽이쳐 흐르는 곳에 한반도 모양을 닮은 지형이 있어요. 물이 땅을 깎고 운반하고 쌓는 과정이 지형을 바꾸어요. 동쪽의 절벽과 서쪽의 낮은 지형을 비교해 보세요.']
 ]},
 {source:'교과서 20~23쪽 · 교사용 지도서 44~48쪽',title:'해안선과 사람들의 생활',cards:[
 ['세 면이 바다인 우리나라','동쪽·서쪽·남쪽이 바다와 맞닿아 있어요. 지도에서 육지와 바다가 만나는 선인 해안선을 따라가며 굽은 정도와 섬의 분포를 비교해요.'],
 ['동해안','해안선이 비교적 단순하고 섬이 적으며, 넓은 모래사장이 있는 곳이 많아요. 죽도 해수욕장처럼 물놀이와 여가 활동이 이루어져요.'],
 ['서해안과 남해안','해안선이 복잡하고 섬이 많아요. 서해안에는 넓은 갯벌이 발달했고, 남해안에서도 갯벌을 볼 수 있어요. 한 해안에도 모래·바위 등 다양한 모습이 함께 있어요.'],
 ['갯벌과 생활','보령 갯벌과 순천만 습지에서는 갯벌 생물과 습지 환경을 관찰할 수 있어요. 서해안에서는 갯벌에서 해산물을 채취하거나 간척한 땅에서 농사를 짓기도 해요.'],
 ['파도가 만든 바위 해안','태종대에서는 파도가 오랫동안 바위를 깎아 만든 절벽과 동굴을 볼 수 있어요. 모래 해안의 재료·경사와 어떻게 다른지 비교해요.'],
 ['여행하며 지키는 자연','해안과 섬은 사람들의 생활 터전이면서 생물의 서식지예요. 관광을 할 때는 쓰레기를 남기지 않고 관찰 안내를 따라요.']
 ]},
 {source:'교과서 30~37쪽 · 교사용 지도서 70~82쪽',title:'독도의 위치와 자연환경',cards:[
 ['지도에서 찾는 독도','독도는 우리나라 동쪽 끝의 동해에 있으며 경상북도 울릉군에 속해요. 울릉도에서 남동쪽으로 약 87.4km 떨어져 있어요. 지도에서 북쪽과 동쪽을 먼저 확인해요.'],
 ['독도에 가는 길','출발지에서 동해안의 항구로 이동하고, 배를 타고 울릉도를 거쳐 독도로 가는 경로를 생각해 볼 수 있어요. 실제 배편과 입도 여부는 날씨와 운영 상황에 따라 달라요.'],
 ['화산이 만든 섬','독도는 오래전 화산 활동으로 만들어졌어요. 동도와 서도, 여러 작은 바위섬으로 이루어져 있어요. 서도는 더 높고 경사가 가파르며, 동도에는 비교적 평탄한 부분이 있어요.'],
 ['바위에 이름 붙이기','촛대바위·코끼리바위·독립문바위처럼 모양을 보고 붙인 이름이 있어요. 관찰 방향에 따라 모습이 달라지므로 여러 방향에서 보고 이름을 붙인 까닭을 설명해요.'],
 ['다양한 생명이 사는 곳','괭이갈매기 같은 새와 해국·사철나무 같은 식물, 주변 바다의 다양한 해양 생물이 살아가요. 차가운 바닷물과 따뜻한 바닷물이 만나는 바다는 좋은 어장을 이루어요.'],
 ['소중한 자연과 자원','독도는 독특한 지형과 생태계를 지닌 곳이에요. 주변 바다에는 수산 자원과 해양 심층수, 가스 하이드레이트 같은 자원이 있어요. 자원의 가치와 자연을 보호할 책임을 함께 생각해요.']
 ]},
 {source:'교과서 42~47쪽 · 교사용 지도서 94~100쪽',title:'독도를 지키는 사람들과 나',cards:[
 ['안용복','조선 시대 안용복은 일본에 건너가 울릉도와 독도가 조선의 땅임을 알리며 우리 땅을 지키려고 노력했어요.'],
 ['홍순칠과 독도 의용 수비대','홍순칠과 독도 의용 수비대는 독도를 지키기 위해 활동했어요. 과거 인물의 활동을 오늘날의 독도 경비대와 구분해 보세요.'],
 ['최종덕','최종덕은 독도로 주민 등록을 옮겨 최초의 독도 주민이 되었어요. 독도가 우리 국민이 살아가는 곳임을 알렸어요.'],
 ['오늘날 정부의 노력','선착장·등대·주민 숙소 등을 설치하고, 독도 경비대가 경비 활동을 해요. 정부는 독도와 주변 바다를 보전·관리하고 정확한 정보를 알려요.'],
 ['학교와 시민의 노력','독도 교육, 전시, 홍보 활동으로 독도의 가치를 알릴 수 있어요. 잘못된 정보를 발견하면 신뢰할 만한 자료를 확인하고 바로잡는 활동에 참여할 수 있어요.'],
 ['내가 할 수 있는 실천','관찰한 특징과 확인한 사실을 담은 소개 카드, 자연을 보호하자는 포스터 등을 만들어 보세요. 무엇을 할지와 그 이유를 함께 설명해요.']
 ]}
];

const titles=['산지와 하천','동해안·서해안·남해안','독도의 위치와 자연환경','독도 지킴이 카드'],names=['새싹 탐험가','산과 강 탐험가','바다 탐험가','독도 탐험가'],rewards=['탐험 나무','조개 조형물','탐험 깃발','지킴이 기념비'];
const defaults=()=>({name:'탐험가',unlocked:4,missions:[0,0,0,0],done:[false,false,false,false],notes:['','','',''],placed:Array(gardenSlots.length).fill(-1)});
let state=defaults(),savedOK=true;try{const raw=JSON.parse(localStorage.getItem('cutie-terrain-v4')||'null');if(raw&&Array.isArray(raw.done)&&raw.done.length===4){state={...state,...raw};state.placed=Array.isArray(raw.placed)&&[8,gardenSlots.length].includes(raw.placed.length)&&raw.placed.every(n=>Number.isInteger(n)&&n>=-1&&n<=3)?[...raw.placed,...Array(gardenSlots.length-raw.placed.length).fill(-1)]:Array(gardenSlots.length).fill(-1);state.unlocked=Math.max(1,Math.min(4,Number(state.unlocked)||1));state.missions=Array.isArray(raw.missions)&&raw.missions.length===4?raw.missions.map((n,i)=>Math.max(0,Math.min(missionTotals[i],Number(n)||0))):[0,0,0,0];state.notes=Array.isArray(raw.notes)&&raw.notes.length===4?raw.notes:['','','',''];}}catch(e){savedOK=false}
let world,learning,current=0,decorationChoice=-1,timer;
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,3600)}
function save(){try{localStorage.setItem('cutie-terrain-v4',JSON.stringify(state))}catch(e){savedOK=false;toast('자동 저장을 사용할 수 없어요. 수업 설정에서 기록을 내려받아 주세요.')}updateLevel()}
function level(){let n=0;while(n<3&&state.done[n])n++;return n}
function maxXP(){return missionTotals.reduce((total,count)=>total+count*10+20,0)}
function xp(){return state.missions.reduce((a,b)=>a+b,0)*10+state.done.filter(Boolean).length*20}

function dialog(html){$('dialogBody').innerHTML=html;if(!$('dialog').open)$('dialog').showModal();world?.keys.clear()}
function action(id,fn){$(id)?.addEventListener('click',fn)}
function setHeading(title,sub){$('worldTitle').textContent=title;$('worldSubtitle').textContent=sub}
function village(){learning?.close();world.placing=false;world.village(state.placed);$('mapBox').hidden=true;$('walkControls').hidden=false;$('interact').hidden=false;$('eyebrow').textContent='MY LITTLE ISLAND';$('worldLabel').textContent='WASD / 방향키: 이동 · 드래그: 시점 회전 · 휠: 확대';setHeading('발견이 자라는 마을','큐티와 함께 걷고, 탐험하고, 나의 정원을 꾸며요.');homePanel();world.resize()}
function homePanel(){document.body.classList.remove('garden-open');$('panel').innerHTML=`<span class="tag">WELCOME HOME</span><h2>${esc(state.name)}의<br>작은 탐험 마을</h2><p class="muted">지형에서 발견한 것들이<br>우리 마을의 새로운 풍경이 돼요.</p><div class="progress"><span style="width:${xp()/maxXP()*100}%"></span></div>${guide('방향키로 너의 탐험가를 움직여 봐! 내 옆에서 E키를 누르면 이야기를 나눌 수 있어.')}<div class="missions"><button id="expeditions" class="primary">탐험 선택하기 →</button><button id="decor">나의 정원 꾸미기</button><button id="atlas">우리나라 지형도</button><button id="study">교과서 탐험 노트</button><button id="rename">탐험가 이름 바꾸기</button></div><p class="hint">학생 탐험가와 큐티는 서로 다른 캐릭터예요. 큐티를 앞·옆·뒤에서 관찰하려면 마을 화면을 끌어 시점을 돌려요.</p>${!savedOK?'<p>현재 자동 저장을 사용할 수 없어요.</p>':''}`;action('atlas',()=>learning.openAtlas());action('study',()=>study(0));action('expeditions',showExpeditions);action('decor',decoratePanel);action('rename',()=>{dialog('<h2>탐험가 이름</h2><input id="nickname" maxlength="15" aria-label="탐험가 이름"><button id="saveName" class="primary">저장</button>');$('nickname').value=state.name;action('saveName',()=>{const n=$('nickname').value.trim();if(!n)return;state.name=n;save();$('dialog').close();homePanel()})})}
function showExpeditions(){dialog(`<span class="tag">EXPEDITION BOARD</span><h2>오늘은 어디로 떠날까요?</h2><p>완료한 탐험은 언제든 다시 볼 수 있어요.</p>${titles.map((t,i)=>`<article><button class="mission-button" data-enter="${i}" ${i>=state.unlocked?'disabled':''}>${i+1}차시 · ${t}<small>${state.done[i]?'완료 ✓ · 다시 탐험하기':i>=state.unlocked?'선생님이 열어 주세요':'탐험 가능 · '+state.missions[i]+'/'+missionTotals[i]+' 학습 단계'}</small></button></article>`).join('')}`);document.querySelectorAll('[data-enter]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.enter);$('dialog').close();enter(i)})}
function enter(i){document.body.classList.remove('garden-open');learning.enter(i)}
function decoratePanel(){if(world.mode!=='village')village();world.placing=true;world.distance=43;world.yaw=0;world.pitch=1.05;world.updateCamera(true);document.body.classList.add('garden-open');decorationChoice=-1;$('panel').innerHTML=`<span class="tag">MY LITTLE GARDEN</span><h2>발견으로 꾸미는 정원</h2>${guide('장식을 선택한 뒤 정원의 동그란 자리를 눌러 봐. 획득한 장식은 마을과 같은 입체 모형으로 놓여!')}<div class="inventory">${rewards.map((r,i)=>`<button data-decor="${i}" ${!state.done[i]?'disabled':''}><img class="decor-preview" data-preview="${i}" alt="${r} 입체 미리보기">${r}<small style="display:block">${state.done[i]?'획득 완료':'탐험 '+(i+1)+' 완료 후 획득'}</small></button>`).join('')}</div><p class="hint">장식은 종류마다 한 개예요. 다른 자리를 선택하면 이동해요. 아래 번호로도 배치할 수 있어요.</p><div class="row">${state.placed.map((v,i)=>`<button data-slot="${i}">${i+1}번 ${v>=0?rewards[v]: '빈 자리'}</button>`).join('')}</div><button id="removeDecor" style="margin-top:14px">선택한 장식 회수</button><button id="finishDecor">꾸미기 완료</button>`;document.querySelectorAll('[data-preview]').forEach(img=>img.src=world.previewDecoration(Number(img.dataset.preview)));document.querySelectorAll('[data-decor]').forEach(b=>b.onclick=()=>{decorationChoice=Number(b.dataset.decor);document.querySelectorAll('[data-decor]').forEach(k=>k.classList.toggle('selected',k===b))});document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>place(Number(b.dataset.slot)));action('removeDecor',()=>{if(decorationChoice<0)return toast('회수할 장식을 선택해 주세요.');state.placed=state.placed.map(n=>n===decorationChoice?-1:n);save();world.updateDecor(state.placed);decoratePanel()});action('finishDecor',()=>{world.placing=false;homePanel()})}
function place(slot){if(decorationChoice<0||!state.done[decorationChoice])return toast('획득한 장식을 먼저 골라 주세요.');if(state.placed[slot]>=0&&state.placed[slot]!==decorationChoice)return toast('다른 장식이 있어요. 빈 자리를 선택하거나 기존 장식을 회수해 주세요.');state.placed=state.placed.map(n=>n===decorationChoice?-1:n);state.placed[slot]=decorationChoice;save();world.updateDecor(state.placed);decoratePanel();toast('정원에 장식을 놓았어요.')}
function book(){dialog(`<span class="tag">FIELD NOTES</span><h2>${esc(state.name)}의 발견 도감</h2>${titles.map((t,i)=>`<article><h3>${i+1}. ${t} ${state.done[i]?'✓':''}</h3><p style="white-space:pre-wrap">${esc(state.notes[i]||'아직 기록이 없어요.')}</p><small>미션 ${state.missions[i]}/${missionTotals[i]}</small></article>`).join('')}`)}
function exportRecord(){const blob=new Blob([JSON.stringify({탐험가:state.name,경험치:xp(),활동지:state.lessonSheets,지킴이카드:state.guardianCard,기록:titles.map((t,i)=>({차시:t,완료:state.done[i],설명:state.notes[i]}))},null,2)],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='terrain-learning-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function teacher(){dialog(`<h2>수업 설정</h2><p>현재 기기에서 열어 둘 차시를 정해요. 원격 제어·교사 인증 기능은 없는 수업 시연용 설정입니다.</p><label for="unlock">탐험 개방 범위</label><select id="unlock">${titles.map((t,i)=>`<option value="${i+1}" ${state.unlocked===i+1?'selected':''}>${i+1}차시까지 열기</option>`).join('')}</select><button id="applyUnlock">적용</button><article><h3>관찰 기준</h3><p>지형의 높낮이와 굴곡을 관찰하는가?<br>입체 모형과 위에서 본 지도를 연결하는가?<br>설명에 관찰 근거 또는 실천 이유를 담는가?</p></article><button id="export">학습 기록 내려받기</button><button id="reset">새 탐험가 시작</button><p class="hint">원본 이미지: 사용자 제공 진주교대 큐티. 마을의 큐티는 원본 이미지를 참고해 만든 입체 캐릭터입니다. 기본 지형은 학습용 모형이며, 실제 지형 관찰은 공개 표고 자료를 인터넷에서 불러옵니다.</p>`);action('applyUnlock',()=>{state.unlocked=Number($('unlock').value);save();$('dialog').close();toast('차시를 열었어요.')});action('export',exportRecord);action('reset',()=>{dialog('<h2>현재 기록을 초기화할까요?</h2><p>이 기기의 학습 기록과 장식이 초기화돼요. 필요한 기록은 먼저 내려받아 주세요.</p><button id="exportAgain">기록 내려받기</button><button id="confirmReset">초기화</button>');action('exportAgain',exportRecord);action('confirmReset',()=>{state=defaults();save();$('dialog').close();village()})})}
action('closeDialog',()=>$('dialog').close());action('home',()=>world&&village());action('book',book);action('teacher',teacher);action('classOpen',()=>learning.openClass());action('rotateLeft',()=>world?.rotate(.2));action('rotateRight',()=>world?.rotate(-.2));action('zoomIn',()=>world?.zoom(-4));action('zoomOut',()=>world?.zoom(4));action('resetCamera',()=>world?.reset());action('interact',()=>interact(world.nearest?.kind||'expedition'));
function interact(kind){if(kind==='cutie'){talk();return}if(kind==='book')book();else if(kind==='decorate')decoratePanel();else showExpeditions()}

function study(i){dialog('<span class="tag">교과서 탐험 노트</span><h2>'+chapters[i].title+'</h2><p class="hint">제공한 '+chapters[i].source+'의 내용을 학생용으로 재구성했어요.</p><div class="row">'+chapters.map((c,j)=>'<button data-chapter="'+j+'">'+titles[j]+'</button>').join('')+'</div>'+chapters[i].cards.map(([h,p])=>'<article><h3>'+h+'</h3><p>'+p+'</p></article>').join(''));document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>study(Number(b.dataset.chapter)))}
function talk(){dialog('<h2>큐티와 이야기하기</h2>'+guide('어서 와, '+esc(state.name)+'! 오늘 발견한 것을 함께 이야기해 볼까?')+'<button id="talkStudy">지형에 대해 알려 줘</button><button id="talkMission">탐험을 시작할래</button><button id="talkPraise">내가 얼마나 탐험했니?</button>');action('talkStudy',()=>study(current));action('talkMission',showExpeditions);action('talkPraise',()=>dialog('<h2>큐티의 응원</h2>'+guide('미션 '+state.missions.reduce((s,n)=>s+n,0)+'개를 해결했구나! '+state.done.filter(Boolean).length+'개의 탐험 기록을 남겼어. 관찰한 근거를 설명하는 멋진 탐험가야.')))}
function atlas(){ learning?.close();$('dialog').close();world.placing=false;$('walkControls').hidden=true;$('interact').hidden=true;$('mapBox').hidden=true;setHeading('실제 지형 관찰실','지역을 고르면 공개 표고 자료로 산의 높낮이를 불러와요.');$('panel').innerHTML='<span class="tag">REAL TERRAIN LAB</span><h2>지도로 읽는 우리 땅</h2>'+guide('한반도의 높은 곳과 낮은 곳을 비교해 봐. 설악산과 영월에서는 능선과 굽이치는 골짜기를 찾아보자.')+'<div class="options"><button data-region="korea">한반도 전체 · 산지 분포</button><button data-region="seorak">설악산 · 능선과 계곡</button><button data-region="yeongwol">영월 · 굽이치는 하천 주변</button><button data-region="coast">태안 해안 · 육지와 바다</button></div><p id="terrainStatus" role="status" class="reading">지역을 선택하세요.</p><label>높이 강조 <input id="heightScale" type="range" min="1" max="8" value="3" step=".5"></label><p class="hint">높이를 강조한 입체 지도예요. 사진이나 위성영상이 아니며 건물·나무는 표현하지 않아요. 표고 자료의 해상도에 따라 작은 물길과 섬은 보이지 않을 수 있어요.</p><button id="flatView">위에서 보기</button><button id="slopeView">비스듬히 보기</button><button id="labBack">마을로 돌아가기</button><button id="studyLab">교과서 탐험 노트</button><p class="hint">표고: Mapzen / AWS Terrain Tiles. 경계: 학습용으로 단순화한 개략 경계. 인터넷 연결이 필요해요. 자료를 불러오지 못하면 실제 지형으로 표시하지 않아요.</p>';document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>world.realTerrain(b.dataset.region));action('labBack',village);action('studyLab',()=>study(current));action('flatView',()=>world.pitch=1.55);action('slopeView',()=>world.pitch=.7);$('heightScale').oninput=()=>world.setRelief(Number($('heightScale').value));world.realTerrain('korea');}

window.createLearningRelief(T, World, textSprite);
learning=window.createTerrainLessons({
  $,esc,action,guide,dialog,toast,save,setHeading,titles,rewards,outline:koreaOutline,
  world:()=>world,state:()=>state,toVillage:village,setCurrent:i=>{current=i},toGarden:()=>{village();decoratePanel()}
});
try{world=new World(null,null,interact,place);village();updateLevel();$('loading').hidden=true;}catch(e){console.error(e);$('loading').textContent='3D 화면을 시작하지 못했어요. 최신 Chrome 또는 Edge에서 하드웨어 가속을 켜고 다시 열어 주세요.';}


}
launch().catch(error => {
  console.error(error);
  document.getElementById('loading').textContent='3D 화면을 준비하지 못했어요. 인터넷 연결을 확인한 뒤 새로고침해 주세요.';
});
</script>
</body>
</html>
